<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Журнал зала</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column tool, sticky header with section tabs; plate colors (red/blue/yellow/green) used only as weight-plate accents */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#e8eaee; --fg:#1b1e24; --muted:#5f6672; --line:#d5d8de;
  --accent:#1f4fd1; --accent-fg:#ffffff; --plate-red:#d23a2a; --plate-yellow:#e2b616; --plate-green:#2e8b4e;
  --danger:#c0352b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1d2026; --surface-2:#262a31; --fg:#eceef2; --muted:#9aa1ad; --line:#323741;
  --accent:#5b84f5; --accent-fg:#0d1020; --plate-red:#ec5a4a; --plate-yellow:#f0c93a; --plate-green:#4cb06e; --danger:#ef6a5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2026; --surface-2:#262a31; --fg:#eceef2; --muted:#9aa1ad; --line:#323741;
  --accent:#5b84f5; --accent-fg:#0d1020; --plate-red:#ec5a4a; --plate-yellow:#f0c93a; --plate-green:#4cb06e; --danger:#ef6a5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font:700 24px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;border-radius:2px;background:var(--plate-red)}
.brand i+i{background:var(--accent);height:26px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{font:600 15px var(--f-body);border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}
nav button[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
main .wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{font:600 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
input,select,textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font:500 22px var(--f-num)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.group{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.group:hover{border-color:var(--accent)}
.group strong{font:700 20px/1.1 var(--f-display);text-transform:uppercase}
.group small{color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.ex:hover{border-color:var(--accent)}
.ex img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--surface-2);flex:none}
.ex .t{min-width:0;display:flex;flex-direction:column}
.ex .t b{font-weight:600}
.ex .t small{color:var(--muted)}
.ex .rank{font:500 13px var(--f-num);color:var(--muted);width:24px;text-align:right;flex:none}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.wcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.wcard:hover{border-color:var(--accent)}
.date{font:700 14px/1 var(--f-display);text-transform:uppercase;text-align:center;background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:56px}
.date b{display:block;font-size:26px}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:6px 8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .n{font:500 14px var(--f-num);color:var(--muted);text-align:center}
.sets input{font-family:var(--f-num);text-align:center;padding:7px 4px}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:6px;padding:4px}
.x:hover{color:var(--danger)}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.plates{display:flex;gap:4px;align-items:center;height:48px}
.plates i{width:12px;border-radius:3px}
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--fg);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgb(0 0 0 / .5)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.frames{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);border-radius:10px;overflow:hidden}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.frames .lbl{position:absolute;left:8px;bottom:8px;background:var(--surface);font-size:12px;padding:2px 8px;border-radius:99px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;z-index:20}
.pick{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:10px 14px}
.pick .btn{background:transparent;color:inherit;border-color:currentColor}
table.m{width:100%;border-collapse:collapse;font-size:14px}
table.m th,table.m td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
svg.spark{width:100%;height:80px;display:block}
@media (max-width:520px){h1{font-size:26px} nav button{padding:8px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header><div class="wrap">
  <div class="brand"><i></i><i></i>Журнал зала</div>
  <nav>
    <button id="tab-log" data-tab="log">Тренировки</button>
    <button id="tab-catalog" data-tab="catalog">Упражнения</button>
    <button id="tab-profile" data-tab="profile">Профиль</button>
  </nav>
</div></header>
<main><div class="wrap" id="view"><p class="muted">Загрузка…</p></div></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="app.js"></script>
</body>
</html>
