<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Batyr FIT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Batyr FIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar; dark gym look, red = training load, yellow = XP */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --surface:#16171b; --surface-2:#202228; --line:#2c2e35; --fg:#f2f2f4; --muted:#8d909a;
  --accent:#ff4433; --accent-fg:#ffffff; --xp:#f5c518; --xp-fg:#16130a; --good:#3fbf74; --bad:#ff5e57; --blue:#4d7cff;
  --brand-gold:#f2b843; --skin:#2a2c33; --idle:#3a3d46; --danger:#ff5e57;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main .wrap{padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05;font-weight:800}
h2{font-size:20px;text-transform:uppercase}
h3{font-size:17px;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* bottom tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;color:var(--muted);font:600 11px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent)}

.btn{font:600 15px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.big{padding:15px 20px;font-size:17px;width:100%}
.back{display:inline-flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);cursor:pointer;padding:0;font:inherit;text-align:left}
.back i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-style:normal;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
input,select,textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 22px/1.2 var(--f-num);overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.xp i{background:var(--xp)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.red{background:var(--accent);color:var(--accent-fg)}
.chip.xp{background:var(--xp);color:var(--xp-fg)}
.chip.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px var(--f-body);padding:8px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* brand */
.brandline{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--f-display);letter-spacing:.14em;color:var(--fg)}
.brandline i{width:18px;height:3px;border-radius:2px;background:var(--brand-gold)}
.brandline span{color:var(--brand-gold)}
/* тренер */
.btn.round{width:52px;height:52px;padding:0;flex:none}
.stat-tile{text-align:left;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.stat-tile:hover{border-color:var(--blue)}
.coach-hero{display:flex;gap:16px;align-items:center}
.score-ring{--p:0;--c:var(--accent);width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;align-content:center;
  background:radial-gradient(closest-side,var(--bg) 79%,transparent 80% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}
.score-ring b{font-size:32px;line-height:1}
.score-ring small{color:var(--muted);font-size:11px}
.score-ring.sm{width:56px;height:56px;background:radial-gradient(closest-side,var(--surface) 76%,transparent 77% 100%),conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0)}
.score-ring.sm b{font-size:17px}
.coach-card{display:flex;gap:14px;align-items:center;width:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:var(--r);padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.ex-chip{border:1px solid var(--line);cursor:pointer;color:var(--fg);font:600 13px var(--f-body);padding:5px 10px}
.ex-chip:hover{border-color:var(--accent)}
/* home hero */
.hero{display:flex;flex-direction:column;gap:10px}
.lvl-line{display:flex;align-items:center;gap:10px}
.badge{width:46px;height:52px;flex:none}
.lvl-name{font:700 15px var(--f-body)}
.streak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);color:var(--fg);padding:5px 12px;border-radius:99px;font:700 14px var(--f-num)}
.streak svg{width:14px;height:14px;color:var(--accent)}
.figure-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:8px;align-items:center}
.figure-grid .side{display:flex;flex-direction:column;gap:8px}
.figure-grid .tile b{font-size:19px}
.body{width:100%;height:auto;display:block}
.body text{fill:var(--muted);font:600 9px var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.quest-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.quest-card.done{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.qicon{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.qicon svg{width:20px;height:20px}
.quest-card.done .qicon{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.quest-card.locked{opacity:.6}
.quest-card .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.quest-card .t b{font-weight:600;line-height:1.25}

/* xp summary */
.xpcard{border:2px solid var(--xp);border-radius:var(--r);padding:14px;background:color-mix(in srgb,var(--xp) 6%,var(--surface));display:flex;flex-direction:column;gap:8px}
.xpcard .big{font:800 34px/1 var(--f-display);color:var(--xp)}
.xpcard .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.xpcard .ln span:last-child{font-family:var(--f-num);color:var(--xp)}
.xpcard hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.levelup{background:linear-gradient(135deg,color-mix(in srgb,var(--xp) 30%,var(--surface)),var(--surface));border:1px solid var(--xp);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}

/* levels ladder */
.ladder{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.step.cur{border-color:var(--xp);background:color-mix(in srgb,var(--xp) 7%,transparent)}
.step.locked{opacity:.55}
.step .t{flex:1;min-width:0}
.step .t b{font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.step .t small{display:block;color:var(--muted)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:500 10px var(--f-num)}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.grow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gload{display:flex;flex-direction:column;gap:10px}
.gload .r{display:flex;flex-direction:column;gap:4px}

/* catalog */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.group{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px}
.group:hover{border-color:var(--accent)}
.group strong{font:700 20px/1.1 var(--f-display);text-transform:uppercase}
.group small{color:var(--muted)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.ex:hover{border-color:var(--accent)}
.ex img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:#fff;flex:none}
.ex .t{min-width:0;display:flex;flex-direction:column}
.ex .t b{font-weight:600}
.ex .t small{color:var(--muted)}
.ex .rank{font:500 13px var(--f-num);color:var(--muted);width:24px;text-align:right;flex:none}

/* journal */
.wcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left;width:100%}
.wcard:hover{border-color:var(--accent)}
.date{font:700 13px/1 var(--f-display);text-transform:uppercase;text-align:center;background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:54px}
.date b{display:block;font-size:24px}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 36px;gap:6px 8px;align-items:center}
.sets .n{font:500 14px var(--f-num);color:var(--muted);text-align:center}
.sets input{font-family:var(--f-num);text-align:center;padding:8px 4px}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:6px;padding:4px;line-height:1}
.x:hover{color:var(--danger)}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* окно упражнения: на телефоне — шторка снизу, на компьютере — окно по центру */
dialog{border:0;padding:0;background:transparent;color:var(--fg);width:min(680px,calc(100vw - 24px));max-width:none;max-height:none;overflow:visible}
dialog::backdrop{background:rgb(0 0 0 / .65)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;max-height:calc(100dvh - 24px);overflow:hidden;transition:transform .2s ease}
.grab-zone{display:none;justify-content:center;padding:10px 0 4px;flex:none;touch-action:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--idle)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.dlg>*{flex-shrink:0}
.dlg-foot{flex:none;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.dlg-foot .btn{flex:1;padding:14px 16px;font-size:16px}
.sheet.leaving{transform:translateY(110%)!important}
@media (max-width:640px){
  dialog{width:100%;margin:auto 0 0;inset:auto 0 0 0}
  .sheet{border-radius:22px 22px 0 0;border-bottom:0;max-height:92dvh;animation:sheetUp .22s ease}
  .grab-zone{display:flex}
  .dlg{padding-top:6px}
}
@media (min-width:641px){.sheet.leaving{transform:scale(.97)!important;opacity:0;transition:transform .18s,opacity .18s}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.frames{position:relative;aspect-ratio:4/3;max-width:100%;background:#fff;border-radius:12px;overflow:hidden}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.frames .cap{position:absolute;left:8px;bottom:8px;background:var(--bg);color:var(--fg);font-size:12px;padding:2px 8px;border-radius:99px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;z-index:20}
.pick{background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:10px 14px}
.pick .btn{background:transparent;color:inherit;border-color:currentColor}
table.m{width:100%;border-collapse:collapse;font-size:14px}
table.m th,table.m td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
table.m th:first-child,table.m td:first-child{text-align:left}
table.m th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto}
svg.spark{width:100%;height:80px;display:block}
@media (max-width:420px){.figure-grid .tile b{font-size:17px} .tile{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main><div class="wrap" id="view"><p class="muted">Загрузка…</p></div></main>
<nav class="tabs" aria-label="Разделы"><div class="in">
  <button id="tab-home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>Главная</button>
  <button id="tab-catalog" data-tab="catalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3.5 9.5v5M18 7v10M20.5 9.5v5M6 12h12"/></svg>Упражнения</button>
  <button id="tab-log" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></svg>Журнал</button>
  <button id="tab-progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>Прогресс</button>
  <button id="tab-profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>Профиль</button>
</div></nav>
<dialog id="dlg" aria-label="Упражнение"><div class="sheet"><div class="grab-zone"><span class="grab"></span></div><div class="dlg" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div></div></dialog>
<script src="app.js"></script>
</body>
</html>
